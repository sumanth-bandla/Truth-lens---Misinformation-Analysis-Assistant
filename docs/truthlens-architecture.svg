      <rect x="733" y="315" width="131" height="21" rx="10.5" fill="#6366F1" fill-opacity=".22"/>
      <text x="748" y="329" fill="#C7D2FE" font-size="10" font-weight="700" letter-spacing=".7">OPTIONAL API</text>
    </g>

    <g>
      <path d="M679 437L706 419H1080L1107 437V571L1080 589H706L679 571V437Z" fill="#050B14" fill-opacity=".62"/>
      <path d="M679 437L706 419H1080L1107 437L1080 455H706L679 437Z" fill="#1C615C"/>
      <path d="M1080 437L1107 437V571L1080 589V455V437Z" fill="#0D292E" stroke="#32857A"/>
