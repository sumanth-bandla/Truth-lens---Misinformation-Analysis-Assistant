      <circle cx="1198" cy="387" r="4" fill="#34D399"/>
      <text x="1210" y="391" fill="#D6E3F1" font-size="11">RLS on every table</text>
      <circle cx="1198" cy="418" r="4" fill="#34D399"/>
      <text x="1210" y="422" fill="#D6E3F1" font-size="11">No service key in app</text>
      <rect x="1192" y="449" width="148" height="22" rx="11" fill="#064E3B" fill-opacity=".65"/>
      <text x="1204" y="464" fill="#A7F3D0" font-size="10" font-weight="700" letter-spacing=".5">TRUSTED DATA BOUNDARY</text>
    </g>

    <path d="M76 642H1364" stroke="#5D7591" stroke-opacity=".35"/>
    <text x="78" y="679" fill="#9FB2CA" font-size="12">AUTHENTICATED WORKSPACE</text>
    <circle cx="300" cy="675" r="3" fill="#64748B"/>
    <text x="319" y="679" fill="#9FB2CA" font-size="12">CLAIM ANALYSIS</text>
    <circle cx="467" cy="675" r="3" fill="#64748B"/>
    <text x="486" y="679" fill="#9FB2CA" font-size="12">OWNER-SCOPED HISTORY</text>
    <text x="1362" y="679" text-anchor="end" fill="#64748B" font-size="11">TRUTHLENS  /  SYSTEM OVERVIEW</text>
