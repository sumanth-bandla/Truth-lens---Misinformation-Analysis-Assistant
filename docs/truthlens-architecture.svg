<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" fill="none" role="img" aria-labelledby="title description">
  <title id="title">TruthLens platform architecture</title>
  <desc id="description">A polished isometric architecture illustration showing the TruthLens web app connected to Gemini analysis and Supabase Auth and private Postgres storage.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1440" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="1" stop-color="#101D32"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#13263F"/>
      <stop offset="1" stop-color="#0C192B"/>
    </linearGradient>
    <linearGradient id="client" x1="120" y1="270" x2="475" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173B62"/>
      <stop offset="1" stop-color="#10223A"/>
    </linearGradient>
    <linearGradient id="gemini" x1="710" y1="190" x2="1120" y2="365" gradientUnits="userSpaceOnUse">
      <stop stop-color="#263D66"/>
      <stop offset="1" stop-color="#172544"/>
    </linearGradient>
    <linearGradient id="database" x1="690" y1="430" x2="1120" y2="615" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123F49"/>
      <stop offset="1" stop-color="#102B3B"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB" filterUnits="objectBoundingBox">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#8BA6C6" stroke-opacity=".055"/>
    </pattern>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1L8 5L1 9" stroke="#60A5FA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1L8 5L1 9" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1440" height="760" rx="28" fill="url(#background)"/>
  <rect width="1440" height="760" rx="28" fill="url(#grid)"/>
  <ellipse cx="356" cy="480" rx="300" ry="180" fill="#2563EB" fill-opacity=".14" filter="url(#shadow)"/>
  <ellipse cx="1048" cy="430" rx="310" ry="220" fill="#14B8A6" fill-opacity=".1" filter="url(#shadow)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="76" y="78" fill="#7DD3FC" font-size="13" font-weight="700" letter-spacing="2.6">TRUTHLENS / PLATFORM MAP</text>
    <text x="76" y="125" fill="#F8FAFC" font-size="35" font-weight="750" letter-spacing="-1">From claim to confident review.</text>
    <text x="78" y="158" fill="#9FB2CA" font-size="16">A private, account-aware workflow for misinformation analysis.</text>

    <path d="M444 350C535 350 555 278 657 278" stroke="#60A5FA" stroke-opacity=".85" stroke-width="2.5" stroke-dasharray="7 8" marker-end="url(#arrowBlue)"/>
    <path d="M444 431C548 431 568 503 657 503" stroke="#34D399" stroke-opacity=".85" stroke-width="2.5" stroke-dasharray="7 8" marker-end="url(#arrowGreen)"/>
    <circle cx="535" cy="348" r="5" fill="#60A5FA"/>
    <circle cx="574" cy="465" r="5" fill="#34D399"/>

