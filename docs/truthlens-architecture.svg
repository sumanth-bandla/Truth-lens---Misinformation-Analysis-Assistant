      <path d="M706 455H1080" stroke="#6EE7B7" stroke-opacity=".27"/>
      <rect x="733" y="478" width="43" height="43" rx="12" fill="#0D9488" fill-opacity=".28" stroke="#5EEAD4" stroke-opacity=".65"/>
      <ellipse cx="754.5" cy="491" rx="11" ry="4.5" stroke="#99F6E4" stroke-width="1.8"/>
      <path d="M743.5 491V507C743.5 509.5 748.4 511.5 754.5 511.5S765.5 509.5 765.5 507V491" stroke="#99F6E4" stroke-width="1.8"/>
      <path d="M743.5 499C743.5 501.5 748.4 503.5 754.5 503.5S765.5 501.5 765.5 499" stroke="#99F6E4" stroke-width="1.5"/>
      <text x="795" y="496" fill="#F8FAFC" font-size="18" font-weight="700">Supabase</text>
      <text x="795" y="518" fill="#B8D9D3" font-size="12">Auth  /  Postgres  /  row-level security</text>
      <rect x="733" y="540" width="132" height="21" rx="10.5" fill="#0D9488" fill-opacity=".24"/>
      <text x="748" y="554" fill="#99F6E4" font-size="10" font-weight="700" letter-spacing=".7">PRIVATE DATA</text>
      <text x="891" y="554" fill="#B8D9D3" font-size="11">profiles  ·  analyses</text>
    </g>

    <g>
      <rect x="1170" y="238" width="194" height="250" rx="18" fill="url(#panel)" stroke="#45617E"/>
      <rect x="1170" y="238" width="194" height="4" rx="2" fill="url(#green)"/>
      <text x="1192" y="277" fill="#A7F3D0" font-size="11" font-weight="700" letter-spacing="1.4">SECURITY</text>
