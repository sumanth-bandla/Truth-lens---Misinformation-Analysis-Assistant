      <path d="M181 337L168 343V351C168 360 174 367 181 369C188 367 194 360 194 351V343L181 337Z" stroke="#93C5FD" stroke-width="2"/>
      <path d="M175 352L179 356L187 347" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="216" y="349" fill="#F8FAFC" font-size="18" font-weight="700">TruthLens app</text>
      <text x="216" y="372" fill="#A9BED7" font-size="12">React 18  /  Vite</text>
      <rect x="160" y="403" width="246" height="1" fill="#7896B7" fill-opacity=".34"/>
      <circle cx="169" cy="430" r="4" fill="#60A5FA"/>
      <text x="184" y="435" fill="#DCE8F5" font-size="13">Claim input and credibility reports</text>
      <circle cx="169" cy="459" r="4" fill="#34D399"/>
      <text x="184" y="464" fill="#DCE8F5" font-size="13">Authenticated user session</text>
      <rect x="159" y="479" width="97" height="19" rx="9.5" fill="#1D4ED8" fill-opacity=".32"/>
      <text x="172" y="493" fill="#BFDBFE" font-size="10" font-weight="700" letter-spacing=".6">WEB CLIENT</text>
    </g>

    <g>
      <path d="M679 214L706 196H1080L1107 214V340L1080 358H706L679 340V214Z" fill="#050B14" fill-opacity=".58"/>
      <path d="M679 214L706 196H1080L1107 214L1080 232H706L679 214Z" fill="#3E4C7A"/>
      <path d="M1080 214L1107 214V340L1080 358V232V214Z" fill="#101D36" stroke="#58699B"/>
